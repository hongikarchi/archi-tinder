<!doctype html>
<meta charset="utf-8">
<title>Mock vs App — side by side</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font: 13px system-ui, sans-serif; background: #1a1a1a; color: #eee; }
  #bar { height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: #111; border-bottom: 1px solid #333; }
  #bar select, #bar input, #bar button { font: inherit; padding: 4px 8px; background: #222; color: #eee; border: 1px solid #444; border-radius: 5px; }
  #bar button { cursor: pointer; }
  #bar button:hover { background: #333; }
  #bar label { color: #999; }
  #wrap { display: flex; height: calc(100% - 44px); }
  .pane { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #333; min-width: 0; }
  .pane h2 { margin: 0; padding: 5px 10px; font-size: 11px; font-weight: 600; letter-spacing: .08em;
             text-transform: uppercase; color: #888; background: #161616; border-bottom: 1px solid #333; }
  .pane iframe { flex: 1; width: 100%; border: 0; background: #fff; }
  #wrap.overlay { position: relative; }
  #wrap.overlay .pane { position: absolute; inset: 0; }
  #wrap.overlay .pane:last-child { opacity: var(--mix, .5); }
</style>
<div id="bar">
  <label>board</label>
  <select id="board"></select>
  <label>route</label>
  <input id="route" size="26" placeholder="/discovery">
  <button id="go">load</button>
  <label>mode</label>
  <select id="mode"><option value="side">side by side</option><option value="overlay">overlay</option></select>
  <input id="mix" type="range" min="0" max="1" step="0.02" value="0.5" style="width:110px">
  <span id="hint" style="color:#666"></span>
</div>
<div id="wrap">
  <div class="pane"><h2>mock</h2><iframe id="fm"></iframe></div>
  <div class="pane"><h2>app</h2><iframe id="fa"></iframe></div>
</div>
<script>
// Board → app route. Overlays and login steps map to the route that hosts them.
const MAP = {
  'discovery':'/discovery', 'taste-swipe':'/swipe', 'results':'/result/1',
  'persona-report':'/board/1/report', 'profile':'/user/me', 'user-other':'/user/2',
  'board-detail':'/board/1', 'liked-projects':'/liked-projects',
  'building-detail':'/buildings/1', 'architect':'/architects/1', 'office':'/office/1',
  'upload':'/upload', 'notifications':'/notifications', 'settings':'/settings',
  'settings-account':'/settings/account', 'settings-appearance':'/settings/appearance',
  'settings-edit-profile':'/settings/edit-profile', 'settings-notifications':'/settings/notifications',
  'llm-search':'/search', 'llm-search-update':'/search',
  'login':'/login', 'login-consent':'/login', 'login-credentials':'/login',
  'login-profile':'/login', 'login-returning':'/login',
};
const OVERLAY_HOST = {
  'overlay-trigger-card':'/discovery', 'overlay-cap-reached':'/discovery',
  'overlay-leave-modal':'/discovery', 'overlay-card-skeleton':'/discovery',
  'overlay-tutorial':'/swipe', 'overlay-swipecard-expanded':'/swipe',
  'overlay-swipe-confirms':'/swipe', 'overlay-question-card':'/swipe',
  'overlay-action-card':'/swipe', 'overlay-photo-lightbox':'/buildings/1',
  'overlay-work-detail':'/buildings/1', 'overlay-save-board':'/board/1',
  'overlay-save-to-board':'/board/1', 'overlay-surprise-board':'/board/1',
  'overlay-share-card':'/upload', 'overlay-verify-gate':'/upload',
};
const BOARDS = Object.keys(MAP).concat(Object.keys(OVERLAY_HOST)).sort();
const sel = document.getElementById('board');
BOARDS.forEach(b => sel.add(new Option(b, b)));
const $ = id => document.getElementById(id);

function routeFor(b) { return MAP[b] || OVERLAY_HOST[b] || '/'; }
function load() {
  const b = sel.value, r = $('route').value || routeFor(b);
  $('fm').src = `/__mocks/${b}.html`;
  $('fa').src = r;
  $('hint').textContent = OVERLAY_HOST[b] ? '(overlay — trigger it in the app pane)' : '';
}
sel.onchange = () => { $('route').value = routeFor(sel.value); load(); };
$('go').onclick = load;
$('mode').onchange = e => $('wrap').classList.toggle('overlay', e.target.value === 'overlay');
$('mix').oninput = e => $('wrap').style.setProperty('--mix', e.target.value);
sel.value = 'discovery'; $('route').value = '/discovery'; load();
</script>
