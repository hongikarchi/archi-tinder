<!doctype html><html data-theme="github-light" data-lang="ko"><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet"><style>:root, [data-theme="github-light"] {
  /* -- Border radius -------------------------------------------------------- */
  --radius-sm:   8px;
  --radius-md:   12px;
  --radius-lg:   20px;
  --radius-xl:   24px;
  --radius-pill: 999px;

  /* -- Motion --------------------------------------------------------------- */
  --motion-fast:     180ms;
  --motion-normal:   220ms;
  --motion-slow:     400ms;
  --motion-flip:     500ms;
  --motion-ease:     cubic-bezier(0.4, 0, 0.2, 1);
  --motion-ease-out: cubic-bezier(0, 0, 0.2, 1);

  /* -- Type scale: desktop (≥769px) ---------------------------------------- */
  --fs-h1:      48px;
  --fs-h2:      30px;
  --fs-body:    18px;
  --fs-caption: 14px;

  /* -- Font weights --------------------------------------------------------- */
  --fw-body:    400;
  --fw-caption: 500;
  --fw-h2:      600;
  --fw-h1:      700;

  /* -- Safe-area ------------------------------------------------------------ */
  --safe-area-bottom: env(safe-area-inset-bottom, 0px);

  /* -- Font family (default: IBM Plex Sans KR) ----------------------------- */
  --font-family: "IBM Plex Sans KR", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;

  /* ── GitHub Light — COLOR TOKENS (default) ─────────────────────────────── */

  /* Surface & text (§1.1 exact) */
  --color-bg:         #FFFFFF;
  --color-surface:    #F6F8FA;
  --color-surface-2:  #EFF2F5;
  --color-surface-3:  #E1E4E8;
  --color-text:       #1F2328;
  --color-text-2:     #24292F;
  --color-text-muted: #656D76;
  --color-text-dim:   #8C959F;
  --color-border:     rgba(0,0,0,0.08);
  --color-border-soft: rgba(0,0,0,0.12);

  /* Additional text hierarchy */
  --color-text-dimmer:  #B1BAC4;
  --color-text-dimmest: #D0D7DE;

  /* Accent (§1.2 exact) */
  --accent-1: #0969DA;
  --accent-2: #8250DF;
  --accent-3: #953800;

  /* Destructive (§1.3 exact) */
  --color-destructive: #D73A49;

  /* Derived spirit tokens — light-mode alpha-on-bg math */
  --color-nav-bg:           rgba(255,255,255,0.97);
  --color-nav-inactive:     #8C959F;
  --color-nav-disabled:     #D0D7DE;
  --color-header-bg:        rgba(255,255,255,0.92);
  --color-ai-bubble:        rgba(246,248,250,0.95);
  --color-ai-bubble-border: rgba(0,0,0,0.08);
  --color-user-bubble:      #E1E4E8;
  --color-user-bubble-text: #1F2328;
  --color-input-bg:         rgba(255,255,255,0.98);
  --color-panel-bg:         rgba(255,255,255,0.98);
  --color-progress-track:   #E1E4E8;
  --color-tag-bg:           rgba(0,0,0,0.07);
  --color-tag-border:       rgba(0,0,0,0.15);
  --color-tag-label:        rgba(0,0,0,0.40);
}

/* ── Mobile type-scale override (≤768px) ───────────────────────────────── */
@media (max-width: 768px) {
  :root {
    --fs-h1:      32px;
    --fs-h2:      24px;
    --fs-body:    16px;
    --fs-caption: 13px;
  }
}

/* ── GitHub Dark ────────────────────────────────────────────────────────── */
[data-theme="github-dark"] {
  --color-bg:         #0d1117;
  --color-surface:    #161b22;
  --color-surface-2:  #1c2128;
  --color-surface-3:  #2d333b;
  --color-text:       #e6edf3;
  --color-text-2:     #cdd9e5;
  --color-text-muted: #768390;
  --color-text-dim:   #636e7b;
  --color-text-dimmer:  #444c56;
  --color-text-dimmest: #2d333b;
  --color-border:     rgba(255,255,255,0.10);
  --color-border-soft: rgba(255,255,255,0.15);

  --accent-1: #2f81f7;
  --accent-2: #a371f7;
  --accent-3: #e3b341;

  --color-destructive: #F85149;

  --color-nav-bg:           rgba(13,17,23,0.97);
  --color-nav-inactive:     #636e7b;
  --color-nav-disabled:     #2d333b;
  --color-header-bg:        rgba(13,17,23,0.92);
  --color-ai-bubble:        rgba(22,27,34,0.88);
  --color-ai-bubble-border: rgba(255,255,255,0.08);
  --color-user-bubble:      #2d333b;
  --color-user-bubble-text: #e6edf3;
  --color-input-bg:         rgba(22,27,34,0.97);
  --color-panel-bg:         rgba(22,27,34,0.97);
  --color-progress-track:   #2d333b;
  --color-tag-bg:           rgba(255,255,255,0.10);
  --color-tag-border:       rgba(255,255,255,0.18);
  --color-tag-label:        rgba(255,255,255,0.50);
}

/* ── Ayu Light ──────────────────────────────────────────────────────────── */
[data-theme="ayu-light"] {
  /* Ayu Light: warm off-white surfaces, warm muted text */
  --color-bg:         #FCFCFC;
  --color-surface:    #F8F9F0;
  --color-surface-2:  #F0F1E8;
  --color-surface-3:  #E6E8DC;
  --color-text:       #3D4047;
  --color-text-2:     #5C6166;
  --color-text-muted: #8A9199;
  --color-text-dim:   #ABB0B8;
  --color-text-dimmer:  #C8CDD4;
  --color-text-dimmest: #DDE1E6;
  --color-border:     rgba(0,0,0,0.07);
  --color-border-soft: rgba(0,0,0,0.11);

  /* Ayu orange accent family */
  --accent-1: #FA8D3E;
  --accent-2: #86B300;
  --accent-3: #E6BA7E;

  --color-destructive: #E5524B;

  --color-nav-bg:           rgba(252,252,252,0.97);
  --color-nav-inactive:     #ABB0B8;
  --color-nav-disabled:     #DDE1E6;
  --color-header-bg:        rgba(252,252,252,0.92);
  --color-ai-bubble:        rgba(248,249,240,0.95);
  --color-ai-bubble-border: rgba(0,0,0,0.07);
  --color-user-bubble:      #E6E8DC;
  --color-user-bubble-text: #3D4047;
  --color-input-bg:         rgba(252,252,252,0.98);
  --color-panel-bg:         rgba(252,252,252,0.98);
  --color-progress-track:   #E6E8DC;
  --color-tag-bg:           rgba(0,0,0,0.06);
  --color-tag-border:       rgba(0,0,0,0.12);
  --color-tag-label:        rgba(0,0,0,0.38);
}

/* ── SynthWave '84 ──────────────────────────────────────────────────────── */
[data-theme="synthwave-84"] {
  /* SynthWave: deep purple-navy bg, vibrant neon accents */
  --color-bg:         #262335;
  --color-surface:    #2a2139;
  --color-surface-2:  #34294f;
  --color-surface-3:  #3d3263;
  --color-text:       #f0eff1;
  --color-text-2:     #e3e1ea;
  --color-text-muted: #a599c5;
  --color-text-dim:   #7e7ab5;
  --color-text-dimmer:  #574f8a;
  --color-text-dimmest: #3d3263;
  --color-border:     rgba(255,255,255,0.08);
  --color-border-soft: rgba(255,255,255,0.13);

  /* SynthWave neon family */
  --accent-1: #FF7EDB;
  --accent-2: #36F9F6;
  --accent-3: #FDE24F;

  --color-destructive: #FF6188;

  --color-nav-bg:           rgba(38,35,53,0.97);
  --color-nav-inactive:     #7e7ab5;
  --color-nav-disabled:     #3d3263;
  --color-header-bg:        rgba(38,35,53,0.92);
  --color-ai-bubble:        rgba(42,33,57,0.88);
  --color-ai-bubble-border: rgba(255,255,255,0.08);
  --color-user-bubble:      #3d3263;
  --color-user-bubble-text: #f0eff1;
  --color-input-bg:         rgba(42,33,57,0.97);
  --color-panel-bg:         rgba(42,33,57,0.97);
  --color-progress-track:   #3d3263;
  --color-tag-bg:           rgba(255,255,255,0.10);
  --color-tag-border:       rgba(255,255,255,0.20);
  --color-tag-label:        rgba(255,255,255,0.55);
}

/* ── Font override: Noto Serif KR ───────────────────────────────────────── */
[data-font="noto-serif"] {
  --font-family: "Noto Serif KR", "본명조", "Nanum Myeongjo", "나눔명조", "AppleMyungjo", "Batang", "바탕", Georgia, serif;
}
