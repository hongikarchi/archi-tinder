<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArchiTinder — Make Web · Project Dashboard</title>
<style>
  :root {
    --bg: #f6f8fa;
    --panel: #ffffff;
    --border: #d0d7de;
    --border-soft: #e5e8eb;
    --text: #1f2328;
    --text-soft: #57606a;
    --text-faint: #8c959f;
    --accent: #0969da;
    --accent-soft: #ddf4ff;
    --green: #1a7f37;
    --green-bg: #dafbe1;
    --grey: #6e7781;
    --grey-bg: #eaeef2;
    --amber: #bf8700;
    --amber-bg: #fff8c5;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  code, .mono { font-family: var(--mono); }

  /* ---- Header ---- */
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 18px 28px 14px;
  }
  header .title {
    font-size: 19px;
    font-weight: 600;
    margin: 0 0 6px;
  }
  header .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 10px;
    font-size: 12.5px;
    color: var(--text-soft);
  }
  header .meta .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--bg);
    border: 1px solid var(--border-soft);
    border-radius: 999px;
    padding: 2px 9px;
  }
  header .meta .chip b { color: var(--text); font-weight: 600; }
  header .meta .chip .mono { font-family: var(--mono); }

  /* ---- Layout ---- */
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 28px 60px; }

  /* ---- Tabs ---- */
  .tabbar {
    display: flex;
    flex-wrap: wrap;
    gap: 2px;
    border-bottom: 1px solid var(--border);
    margin-top: 0;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 5;
    padding-top: 14px;
  }
  .tab-btn {
    appearance: none;
    border: none;
    background: transparent;
    font-family: var(--sans);
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text-soft);
    padding: 9px 14px 8px;
    cursor: pointer;
    border-bottom: 2.5px solid transparent;
    margin-bottom: -1px;
    border-radius: 6px 6px 0 0;
  }
  .tab-btn:hover { background: var(--panel); color: var(--text); }
  .tab-btn.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
    background: var(--panel);
  }
  .panel { display: none; padding-top: 22px; }
  .panel.active { display: block; }

  /* ---- Generic blocks ---- */
  .section-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin: 26px 0 10px;
  }
  .section-title:first-child { margin-top: 0; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .card .row-id {
    font-family: var(--mono);
    font-size: 11.5px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 4px;
    padding: 1px 6px;
    margin-right: 8px;
  }
  .card .row-title { font-weight: 600; }
  .card .row-note { color: var(--text-soft); font-size: 13px; margin-top: 5px; }
  .card .row-meta {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--text-faint);
    margin-top: 6px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px 12px;
  }

  .empty {
    color: var(--text-faint);
    font-style: italic;
    padding: 8px 2px;
    font-size: 13px;
  }
  .note-line {
    font-size: 12.5px;
    color: var(--text-soft);
    background: var(--grey-bg);
    border-radius: 6px;
    padding: 9px 12px;
    margin-top: 14px;
  }

  /* ---- Badges ---- */
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }

  /* ---- Phase milestones table (collapsed in Done) ---- */
  details.milestones {
    margin-top: 26px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 0;
  }
  details.milestones > summary {
    cursor: pointer;
    list-style: none;
    padding: 10px 16px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-faint);
  }
  details.milestones > summary::-webkit-details-marker { display: none; }
  details.milestones > summary::before {
    content: "▸ ";
    color: var(--text-faint);
    font-weight: 400;
  }
  details.milestones[open] > summary::before { content: "▾ "; }
  details.milestones table.grid { border: none; border-radius: 0; }

  table.grid {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  table.grid th, table.grid td {
    text-align: left;
    padding: 9px 14px;
    border-bottom: 1px solid var(--border-soft);
    vertical-align: top;
  }
  table.grid th {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-faint);
    background: var(--bg);
  }
  table.grid tr:last-child td { border-bottom: none; }
  table.grid td.c-phase { font-family: var(--mono); font-weight: 600; white-space: nowrap; width: 70px; }
  table.grid td.c-status { white-space: nowrap; width: 1%; }
  table.grid td.c-mono { font-family: var(--mono); font-size: 12.5px; }

  /* ---- PR list ---- */
  .pr-item {
    display: flex;
    align-items: baseline;
    gap: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 8px;
  }
  .pr-item .pr-n {
    font-family: var(--mono);
    font-weight: 700;
    color: var(--accent);
    flex: 0 0 auto;
  }
  .pr-item .pr-title { flex: 1 1 auto; }
  .pr-item .pr-when {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-faint);
    flex: 0 0 auto;
    white-space: nowrap;
  }

  /* ---- Mermaid block ---- */
  .mermaid-block {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 16px;
    overflow-x: auto;
  }
  .mermaid-block .mb-caption {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-soft);
    margin-bottom: 6px;
  }
  .mermaid {
    font-family: var(--sans);
    text-align: center;
  }
  .mermaid svg { max-width: 100%; height: auto; }

  footer {
    color: var(--text-faint);
    font-size: 11.5px;
    text-align: center;
    padding-top: 30px;
  }

  @media (max-width: 640px) {
    .wrap, header { padding-left: 16px; padding-right: 16px; }
    .pr-item { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<header>
  <h1 class="title" id="hdr-project">Project Dashboard</h1>
  <div class="meta" id="hdr-meta"></div>
</header>

<div class="wrap">
  <nav class="tabbar" id="tabbar"></nav>

  <section class="panel" id="panel-done"></section>
  <section class="panel" id="panel-now"></section>
  <section class="panel" id="panel-next"></section>
  <section class="panel" id="panel-systemflow"></section>
  <section class="panel" id="panel-agentflow"></section>

  <footer>Static project dashboard · renders <code>project/state.js</code> · no server required</footer>
</div>

<!-- Vendored Mermaid v10 (offline-safe; file:// double-click compatible) -->
<script src="./mermaid.min.js"></script>
<!-- Data first, render second — both plain scripts so file:// double-click works -->
<script src="state.js"></script>
<!-- Local override (gitignored, written by `make dashboard`) — fresher view without commit churn; absent on plain file:// double-click = silent no-op -->
<script src="state.local.js"></script>
<script>
(function () {
  "use strict";

  var S = (typeof window !== "undefined" && window.PROJECT_STATE) || {};

  /* ---------- helpers ---------- */
  function esc(v) {
    if (v === null || v === undefined) return "";
    return String(v)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }
  function arr(v) { return Array.isArray(v) ? v : []; }
  function has(v) { return Array.isArray(v) && v.length > 0; }
  function emptyMsg(label) {
    return '<div class="empty">' + esc(label || "none") + "</div>";
  }
  function set(id, html) {
    var el = document.getElementById(id);
    if (el) el.innerHTML = html;
  }

  var STATUS_COLOR = {
    "shipped":     { fg: "var(--green)", bg: "var(--green-bg)" },
    "pending":     { fg: "var(--grey)",  bg: "var(--grey-bg)" },
    "in progress": { fg: "var(--amber)", bg: "var(--amber-bg)" }
  };
  function statusBadge(status) {
    var key = String(status || "").toLowerCase();
    var c = STATUS_COLOR[key] || { fg: "var(--grey)", bg: "var(--grey-bg)" };
    return '<span class="badge" style="color:' + c.fg + ';background:' + c.bg + '">'
         + esc(status || "—") + "</span>";
  }

  /* ---------- header ---------- */
  function renderHeader() {
    var m = S.meta || {};
    document.getElementById("hdr-project").textContent = m.name || "Project Dashboard";
    var chips = [];
    if (m.updatedAt) chips.push('<span class="chip">updated <b>' + esc(m.updatedAt) + "</b></span>");
    if (m.branch)    chips.push('<span class="chip">branch <b class="mono">' + esc(m.branch) + "</b></span>");
    if (m.head)      chips.push('<span class="chip">head <b class="mono">' + esc(m.head) + "</b></span>");
    set("hdr-meta", chips.length ? chips.join("") : emptyMsg("no metadata"));
  }

  /* ---------- card renderer (shared by done/now/next) ---------- */
  function taskCard(t, opts) {
    t = t || {};
    opts = opts || {};
    var h = '<div class="card">';
    h += "<div>";
    if (t.id) h += '<span class="row-id">' + esc(t.id) + "</span>";
    h += '<span class="row-title">' + esc(t.title || "(untitled)") + "</span>";
    h += "</div>";
    if (t.note) h += '<div class="row-note">' + esc(t.note) + "</div>";

    var meta = [];
    if (opts.completedAt && t.completedAt) meta.push("completed " + esc(t.completedAt));
    if (opts.startedAt && t.startedAt)     meta.push("started " + esc(t.startedAt));
    if (has(t.prs)) {
      meta.push("PRs: " + t.prs.map(function (n) { return "#" + esc(n); }).join(" · "));
    }
    if (meta.length) h += '<div class="row-meta">' + meta.join('<span style="color:var(--border)">|</span>') + "</div>";
    h += "</div>";
    return h;
  }

  /* ---------- 1. Done ---------- */
  function renderDone() {
    var h = "";

    h += '<div class="section-title">Recent Merged PRs (latest 8)</div>';
    var prs = arr(S.prs);
    if (prs.length) {
      prs.forEach(function (p) {
        p = p || {};
        h += '<div class="pr-item">';
        h += '<span class="pr-n">#' + esc(p.number != null ? p.number : "?") + "</span>";
        h += '<span class="pr-title">' + esc(p.title || "(no title)") + "</span>";
        h += '<span class="pr-when" title="' + esc(p.mergedAt || "") + '">' + esc(p.mergedAtKST || p.mergedAt || "—") + "</span>";
        h += "</div>";
      });
    } else {
      h += emptyMsg("no pull requests");
    }

    h += '<div class="section-title">Resolved Work</div>';
    var done = arr(S.done);
    if (done.length) {
      done.forEach(function (d) {
        h += taskCard(d, { completedAt: true });
      });
    } else {
      h += emptyMsg("no resolved work");
    }

    h += '<details class="milestones">';
    h += '<summary>Phase Milestones (archive)</summary>';
    var ms = arr(S.milestones);
    if (ms.length) {
      h += '<table class="grid"><thead><tr>'
         + "<th>Phase</th><th>Focus</th><th>Status</th>"
         + "</tr></thead><tbody>";
      ms.forEach(function (r) {
        r = r || {};
        h += "<tr>"
           + '<td class="c-phase">' + esc(r.phase || "—") + "</td>"
           + "<td>" + esc(r.focus || "—") + "</td>"
           + '<td class="c-status">' + statusBadge(r.status) + "</td>"
           + "</tr>";
      });
      h += "</tbody></table>";
    } else {
      h += emptyMsg("no milestones");
    }
    h += "</details>";

    set("panel-done", h);
  }

  /* ---------- 2. Now ---------- */
  function renderNow() {
    var h = '<div class="section-title">Current Initiative Slice</div>';
    var now = arr(S.now);
    if (now.length) {
      now.forEach(function (n) {
        h += taskCard(n, { startedAt: true });
      });
    } else {
      h += emptyMsg("nothing in flight");
    }
    h += '<div class="note-line">Each entry is a single in-flight initiative — may span one PR (single fix) or many PRs (design-system rework, dashboard rework). Update <code>Task.md</code> <code>## Now</code> section to add or remove.</div>';
    set("panel-now", h);
  }

  /* ---------- 3. Next ---------- */
  function renderNext() {
    var h = "";
    var nextObj = S.next || {};
    // Backward-compat: if state.js still ships an array (pre-priority-hierarchy),
    // render everything under a single section.
    if (Array.isArray(nextObj)) {
      h += '<div class="section-title">Backlog</div>';
      if (nextObj.length) {
        nextObj.forEach(function (n) { h += taskCard(n, {}); });
      } else {
        h += emptyMsg("backlog empty");
      }
    } else {
      var buckets = [
        { key: "xhigh",  label: "X-HIGH priority — confirmed defect vs core taste-match promise / data correctness" },
        { key: "high",   label: "HIGH priority — next initiative slice candidate" },
        { key: "medium", label: "MEDIUM priority — uncategorised pending" },
        { key: "low",    label: "LOW priority — explicitly deferred / skipped" },
      ];
      buckets.forEach(function (b) {
        h += '<div class="section-title">' + esc(b.label) + "</div>";
        var items = arr(nextObj[b.key]);
        if (items.length) {
          items.forEach(function (n) { h += taskCard(n, {}); });
        } else {
          h += emptyMsg("(empty)");
        }
      });
    }
    h += '<div class="note-line">Source: <code>Task.md</code> <code>## Next</code> section. HIGH = specced, ready to pull into <code>## Now</code>; MEDIUM = pending review; LOW = explicitly deferred — revisit when context shifts.</div>';
    set("panel-next", h);
  }

  /* ---------- 4. System Flow (2 Mermaid diagrams) ---------- */
  function renderSystemFlow() {
    var h = "";
    var sf = S.systemFlow || {};
    var rf = S.recommendationFlow || {};

    h += '<div class="mermaid-block">';
    h += '<div class="mb-caption">' + esc(sf.title || "System Flow") + "</div>";
    h += '<div class="mermaid" id="mm-systemflow"></div>';
    h += "</div>";

    h += '<div class="mermaid-block">';
    h += '<div class="mb-caption">' + esc(rf.title || "Recommendation / Swipe Flow") + "</div>";
    h += '<div class="mermaid" id="mm-recflow"></div>';
    h += "</div>";

    set("panel-systemflow", h);

    // textContent (not innerHTML) — Mermaid expects raw syntax incl. literal <br/>
    var smm = document.getElementById("mm-systemflow");
    if (smm) smm.textContent = sf.mermaid || "flowchart LR\n  Empty[no diagram]";
    var rmm = document.getElementById("mm-recflow");
    if (rmm) rmm.textContent = rf.mermaid || "flowchart TD\n  Empty[no diagram]";
  }

  /* ---------- 5. Agent Flow (1 Mermaid + roster table) ---------- */
  function renderAgentFlow() {
    var h = "";
    var af = S.agentFlow || {};

    h += '<div class="mermaid-block">';
    h += '<div class="mb-caption">' + esc(af.title || "Agent Flow") + "</div>";
    h += '<div class="mermaid" id="mm-agentflow"></div>';
    h += "</div>";

    h += '<div class="section-title">Agent Roster</div>';
    var agents = arr(S.agents);
    if (agents.length) {
      h += '<table class="grid"><thead><tr>'
         + "<th>Agent</th><th>Role</th><th>Model</th><th>Effort</th>"
         + "</tr></thead><tbody>";
      agents.forEach(function (a) {
        a = a || {};
        h += "<tr>"
           + '<td class="c-mono"><b style="color:var(--accent)">' + esc(a.name || "(agent)") + "</b></td>"
           + "<td>" + esc(a.role || "—") + "</td>"
           + '<td class="c-mono">' + esc(a.model || "—") + "</td>"
           + '<td class="c-mono">' + esc(a.effort || "default") + "</td>"
           + "</tr>";
      });
      h += "</tbody></table>";
    } else {
      h += emptyMsg("no agents");
    }
    set("panel-agentflow", h);

    var amm = document.getElementById("mm-agentflow");
    if (amm) amm.textContent = af.mermaid || "flowchart LR\n  Empty[no diagram]";
  }

  /* ---------- Mermaid render hook ----------
   * v10 with startOnLoad:false. After every panel innerHTML inject that may
   * contain `.mermaid` blocks, call mermaid.run() against that panel's
   * selector. Mermaid is idempotent — calling twice on the same node is a
   * no-op once data-processed is set.
   */
  function runMermaid(panelId) {
    if (typeof window.mermaid === "undefined" || typeof window.mermaid.run !== "function") return;
    try {
      window.mermaid.run({ querySelector: "#" + panelId + " .mermaid" });
    } catch (e) {
      console.error("mermaid.run failed for " + panelId, e);
    }
  }

  /* ---------- tabs ---------- */
  var TABS = [
    { id: "done",        label: "Done" },
    { id: "now",         label: "Now" },
    { id: "next",        label: "Next" },
    { id: "systemflow",  label: "System Flow" },
    { id: "agentflow",   label: "Agent Flow" }
  ];

  function activateTab(id) {
    TABS.forEach(function (t) {
      var btn = document.getElementById("tabbtn-" + t.id);
      var panel = document.getElementById("panel-" + t.id);
      var on = (t.id === id);
      if (btn) btn.classList.toggle("active", on);
      if (panel) panel.classList.toggle("active", on);
    });
    // Mermaid: render lazily once the target panel is display:block.
    // Mermaid v10 derives SVG size from the live DOM box, so rendering inside
    // display:none containers produces 0×0 outputs that look "blank" later.
    if (id === "systemflow" || id === "agentflow") {
      runMermaid("panel-" + id);
    }
  }

  function buildTabbar() {
    var bar = document.getElementById("tabbar");
    if (!bar) return;
    bar.innerHTML = "";
    TABS.forEach(function (t) {
      var b = document.createElement("button");
      b.className = "tab-btn";
      b.id = "tabbtn-" + t.id;
      b.type = "button";
      b.textContent = t.label;
      b.addEventListener("click", function () { activateTab(t.id); });
      bar.appendChild(b);
    });
  }

  /* ---------- init ---------- */
  function init() {
    if (typeof window.mermaid !== "undefined") {
      try {
        window.mermaid.initialize({
          startOnLoad: false,
          theme: "default",
          flowchart: { htmlLabels: true, curve: "basis" },
          securityLevel: "loose"
        });
      } catch (e) {
        console.error("mermaid.initialize failed", e);
      }
    }

    renderHeader();
    renderDone();
    renderNow();
    renderNext();
    renderSystemFlow();
    renderAgentFlow();
    buildTabbar();
    activateTab("done"); // default landing tab; activateTab() lazy-loads Mermaid for flow tabs
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
