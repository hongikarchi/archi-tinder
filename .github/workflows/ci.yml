name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (pytest + migrations check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        # conftest.py overrides DB to SQLite in-memory, so no Postgres service needed.
        # Stops on first failure for faster feedback.
        run: pytest -x

      - name: makemigrations --check (no pending migrations)
        # Catches the case where a model change wasn't accompanied by a migration.
        # Also catches duplicate migration numbers when paired with the local pre-push hook.
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          DJANGO_SECRET_KEY: ci-secret-key-not-for-production
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: ci_db
          DB_USER: ci_user
          DB_PASSWORD: ci_pass
          DJANGO_DEBUG: 'True'
        run: python manage.py makemigrations --check --dry-run

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
