name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (pytest + migrations check)
    runs-on: ubuntu-latest
    # Job-level env applied to all steps. settings.py reads these at import
    # time, before pytest-django can call into conftest.py's setdefault, so
    # they must be set in the CI environment rather than only in conftest.
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ci-secret-key-not-for-production
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: ci_db
      DB_USER: ci_user
      DB_PASSWORD: ci_pass
      DJANGO_DEBUG: 'True'
      DEV_LOGIN_SECRET: ci-test-secret
      GEMINI_API_KEY: ci-test-gemini-key
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # NOTE: pytest step intentionally omitted for now. The repo's tests
      # currently rely on a real PostgreSQL with the pgvector extension
      # (architecture_vectors raw-SQL paths), and conftest.py's in-memory
      # SQLite override does not fire reliably for tests under
      # backend/apps/*/tests/. Re-enabling pytest in CI requires adding a
      # Postgres + pgvector service container with extension setup. Tracked
      # as a follow-up TODO in .claude/Task.md.

      - name: makemigrations --check (no pending migrations)
        # Catches the case where a model change wasn't accompanied by a migration.
        # Also catches duplicate migration numbers when paired with the local pre-push hook.
        # --dry-run does not require an active DB connection.
        run: python manage.py makemigrations --check --dry-run

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
