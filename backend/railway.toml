[build]
# `migrate --noinput` runs on every deploy. Migrations are idempotent
# (no-op when already applied) so this is safe and hardens deploys against
# future schema additions (e.g. PROF2 / BOARD1 / Phase 14+) without
# requiring manual `manage.py migrate` runs from a Railway shell.
buildCommand = "pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput"

[deploy]
# --workers 3: a single sync worker serializes every request, so one slow
# request (cold recommendation `discovery`, LLM `parse-query`) blocks the
# whole backend and queues everything behind it.
# --timeout 120: gunicorn's 30s default SIGKILLs a slow cold-cache request
# before it can finish and warm the in-process pool/KMeans cache.
startCommand = "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120"
