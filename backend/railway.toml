[build]
# INFRA-DB-1 (2026-05-25): Railway runtime logs in as `make_web_app` (no DDL).
# `manage.py migrate` must be run manually from an operator machine with
# DB_USER=neondb_owner temporarily swapped in. Running migrate here would fail
# on any schema-changing migration. See backend/.env.example role separation
# section for the operator-side runbook.
buildCommand = "pip install -r requirements.txt && python manage.py collectstatic --noinput"

[deploy]
# --workers 3: a single sync worker serializes every request, so one slow
# request (cold recommendation `discovery`, LLM `parse-query`) blocks the
# whole backend and queues everything behind it.
# --timeout 120: gunicorn's 30s default SIGKILLs a slow cold-cache request
# before it can finish and warm the in-process pool/KMeans cache.
startCommand = "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120"
