[build]
# INFRA-DB-1 (2026-05-25): Railway runtime logs in as `make_web_app` (no DDL).
# `manage.py migrate` must be run manually from an operator machine with
# DB_USER=neondb_owner temporarily swapped in. Running migrate here would fail
# on any schema-changing migration. See backend/.env.example role separation
# section for the operator-side runbook.
buildCommand = "pip install -r requirements.txt && python manage.py collectstatic --noinput"

[deploy]
# PERF-ROUND2: --worker-class gthread --workers 3 --threads 4 (12 concurrent requests).
# Sync workers serialise: one slow request (cold recommendation `discovery`, LLM
# `parse-query`) blocked its whole worker, and DB / LLM / R2 waits are I/O that
# threads overlap. Module-level per-request state was audited for threads
# (engine embedding/centroid caches under a lock, telemetry stats thread-local,
# lazy LLM clients built once under a lock) -- see tests/test_gthread_safety.py.
#
# DB connection math (Neon max_connections = 901) -- PERF-CONN-1 (2026-09-30):
#   Both aliases ('default' app DB, 'buildings' Make-DB) use CONN_MAX_AGE=600, so
#   Django keeps ONE persistent connection per request THREAD per alias:
#     per alias up to workers x threads = 3 x 4 = 12 request-thread connections,
#     x2 aliases = up to 24 persistent connections per replica.
#   Background threads (swipe prefetch + telemetry, search Stage 2 + parse-query
#   stream worker, board-name update, works uploads) open their own transient
#   connections and connections.close_all() in a `finally` at exit, so they never
#   accumulate (a few extra, short-lived). Far below 901. Re-check this arithmetic
#   before raising --workers/--threads or adding replicas, and keep close_all() in
#   any NEW thread that touches the DB.
# --timeout 120: gunicorn's 30s default kills a worker whose heartbeat stalls, and
# would SIGKILL a slow cold-cache request before it can finish and warm the
# in-process pool/KMeans cache. gthread's main thread keeps the heartbeat while
# request threads run, but keep the generous ceiling for the cold LLM/KMeans paths.
startCommand = "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --worker-class gthread --workers 3 --threads 4 --timeout 120"
